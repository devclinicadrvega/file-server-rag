services:
  file-server:
    build: .
    container_name: file-server
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - file_server_data:/data
    environment:
      - API_KEY=${API_KEY}
      - PUBLIC_URL=${PUBLIC_URL:-https://files.crm.clinicadrvega.com}
      - STORAGE_PATH=/data/files
      - DB_PATH=/data/fileserver.db
      - SHARE_TOKEN_HOURS=${SHARE_TOKEN_HOURS:-48}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - DEBUG=${DEBUG:-false}

volumes:
  file_server_data:
    driver: local
